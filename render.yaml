services:
  - type: web
    name: soulup-ia-api
    runtime: python
    rootDir: ia
    buildCommand: pip install -r requirements.txt && python treinar_modelos.py
    startCommand: gunicorn --bind 0.0.0.0:$PORT dataset_code:app
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8

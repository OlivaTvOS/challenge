name: Java build

on:
  pull_request:
    branches: [java]
    paths:
      - '**/*.java'
      - 'pom.xml'
      - 'Dockerfile'
      - '.github/workflows/java-build.yml'
  push:
    branches: [java, 'fix/**']
    paths:
      - '**/*.java'
      - 'pom.xml'
      - 'Dockerfile'
      - '.github/workflows/java-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Compile and package
        run: mvn -B -DskipTests package
